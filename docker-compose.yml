services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - naijaspa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    container_name: naijaspa-postgres
    environment:
      POSTGRES_USER: naijaspa
      POSTGRES_PASSWORD: naijaspa
      POSTGRES_DB: naijaspa
    ports:
      - "5432:5432"
    volumes:
      - naijaspa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naijaspa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naijaspa_redis:
  naijaspa_pg:
