server {
    listen 80;
    listen [::]:80;
    server_name naijaspa.com www.naijaspa.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://naijaspa.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.naijaspa.com;
    ssl_certificate /etc/letsencrypt/live/naijaspa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijaspa/privkey.pem;
    return 301 https://naijaspa.com$request_uri;
}

server {
    listen 443 ssl;
    server_name naijaspa.com;
    ssl_certificate /etc/letsencrypt/live/naijaspa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijaspa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
